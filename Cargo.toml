[package]
name = "tempest_forge"
version = "0.1.0"
edition = "2024"
    
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "0.18", features = ["serialize", "wav", "mp3", "vorbis", "webgpu"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "AudioContext"] }
noise = "0.9.0"
rand = "0.10.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-lite = "2.6"
getrandom = { version = "0.4", features = ["wasm_js"] }
thiserror = "2.0.18"


# Physics Engine - Rapier3d (compatible with Bevy 0.18)
bevy_rapier3d = "0.33"
rapier3d = "0.21"

# UI Framework - egui (compatible with Bevy 0.18)
bevy_egui = "0.39.1"
bevy-inspector-egui = "0.36.0"

# Particle Effects (Modern GPU system for Bevy 0.18)
bevy_hanabi = "0.18"

# Terrain Noise
bracket-noise = "0.8"

# Voxel Rendering - bevy_voxel_world (compatible with Bevy 0.18)
bevy_voxel_world = "0.15.1"
fastrand = "2.4.1"

# Procedural tree generation via space colonization algorithm
shrubbery = { git = "https://github.com/TanTanDev/shrubbery" }
bevy_procedural_tree = "0.3"
bevy_animation_graph = "0.10.0"
bytemuck = "1.25.0"
bevy_fn_plugin = "0.1.2"
glam = "0.33.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug-assertions = false
debug = false
overflow-checks = false
rpath = false

[profile.dev]
opt-level = 1                  # Light optimization (good balance)
debug = true                   # Full debug info
split-debuginfo = "unpacked"   # Better debugging on macOS
overflow-checks = true         # Catch bugs during development
incremental = true             # Faster incremental compiles

[profile.dev.package.bevy]
opt-level = 3

[profile.dev.package.wgpu]
opt-level = 3

[profile.dev.package."wgpu-core"]
opt-level = 3