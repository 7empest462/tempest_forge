<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempest Forge - WebGPU</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            width: 100%;
            height: 100%;
            outline: none;
        }
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: #00c8ff;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            cursor: pointer;
            z-index: 1000;
            transition: opacity 0.5s;
        }
    </style>
    <script>
        // INTERCEPT AudioContext creation to capture Bevy's internal context
        (function() {
            const OriginalAudioContext = window.AudioContext || window.webkitAudioContext;
            window.AudioContext = window.webkitAudioContext = function(...args) {
                const ctx = new OriginalAudioContext(...args);
                window.bevyAudioContext = ctx;
                console.log("Captured AudioContext:", ctx);
                return ctx;
            };
        })();
    </script>
</head>
<body>
    <div id="overlay">CLICK TO START FORGING</div>
    <canvas id="bevy"></canvas>
    <script>
        const overlay = document.getElementById('overlay');
        overlay.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => overlay.remove(), 500);
            
            // Resume Bevy's specific context if captured
            if (window.bevyAudioContext) {
                console.log("Resuming Captured Bevy AudioContext...");
                window.bevyAudioContext.resume().then(() => {
                    console.log("Captured Context State:", window.bevyAudioContext.state);
                });
            } else {
                // Fallback only if we didn't capture Bevy's context yet
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const ctx = new AudioContext();
                if (ctx.state === 'suspended') {
                    ctx.resume();
                }
            }

            // Lock Pointer immediately on click
            const canvas = document.getElementById('bevy');
            if (canvas.requestPointerLock) {
                canvas.requestPointerLock();
            }
        }, { once: true });
    </script>
    <script type="module">
        import init, { start_game } from './out/tempest_forge.js';
        async function run() {
            await init();
            start_game();
        }
        run().catch((error) => {
            if (!error.message.startsWith("Using exceptions for control flow,")) {
                throw error;
            }
        });
    </script>
</body>
</html>
